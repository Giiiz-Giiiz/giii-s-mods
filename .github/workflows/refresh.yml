name: refresh

# Re-signs the short-lived metadata every day (the timestamp expires after 2
# days) so devices keep accepting the library. Packages never change here; see
# tools/refresh.py. Needs the repository secrets INDEX_TIMESTAMP_KEY,
# INDEX_SNAPSHOT_KEY and INDEX_TARGETS_KEY (online role keys; the root key
# stays offline with the maintainers).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "cryptography==50.0.2"
      - name: Re-sign
        env:
          INDEX_TIMESTAMP_KEY: ${{ secrets.INDEX_TIMESTAMP_KEY }}
          INDEX_SNAPSHOT_KEY: ${{ secrets.INDEX_SNAPSHOT_KEY }}
          INDEX_TARGETS_KEY: ${{ secrets.INDEX_TARGETS_KEY }}
        run: python tools/refresh.py --site .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "再署名（timestamp）"
          git push -q
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
